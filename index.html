<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>DevPulse — Paused</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: radial-gradient(ellipse at top, #172554 0%, #0b1220 55%, #060913 100%);
      color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px); text-align: center; padding: 48px 30px;
      border: 1px solid rgba(148,163,184,.25); border-radius: 24px;
      background: rgba(15,23,42,.72); box-shadow: 0 24px 80px rgba(0,0,0,.3);
    }
    .eyebrow { color: #93c5fd; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 700; }
    h1 { margin: 12px 0 14px; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.04em; }
    p { margin: 0 auto; max-width: 460px; color: #cbd5e1; line-height: 1.7; font-size: 16px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 9px 14px;
      border: 1px solid rgba(251,191,36,.28); border-radius: 999px; color: #fde68a; font-size: 13px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; }
    footer { margin-top: 36px; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DevPulse</div>
    <h1>Project Paused</h1>
    <p>Live global developer activity visualization is temporarily unavailable. DevPulse has been paused while its infrastructure is taken offline.</p>
    <div class="status"><span class="dot"></span> Live activity is offline</div>
    <footer>Thank you for checking out DevPulse.</footer>
  </main>
</body>
</html>
