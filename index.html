<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevPulse — Live Global Developer Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root {
    --bg: #05070C;
    --panel: rgba(10, 15, 24, 0.68);
    --border: #1B2A3D;
    --chrome: #4FD8E8;
    --chrome-dim: rgba(79, 216, 232, 0.35);
    --text: #E8ECF4;
    --text-dim: #6E7C93;
    --green: #3ECF8E;
    --amber: #F2A65A;
    --red: #F2545B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'Rajdhani', sans-serif; color: var(--text); }
  #cesiumContainer { position: absolute; inset: 0; }
  .cesium-widget-credits { display: none !important; }

  #boot {
    position: fixed; inset: 0; z-index: 999;
    background: #05070C;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.8s ease;
  }
  #boot-text {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--chrome); font-size: 13px; letter-spacing: 1.5px; opacity: 0.85;
  }
  #boot-text span { display: block; margin-bottom: 6px; opacity: 0; animation: bootline 0.4s forwards; }
  #boot-text span:nth-child(1) { animation-delay: 0.1s; }
  #boot-text span:nth-child(2) { animation-delay: 0.5s; }
  #boot-text span:nth-child(3) { animation-delay: 0.9s; }
  #boot-text span:nth-child(4) { animation-delay: 1.3s; }
  @keyframes bootline { to { opacity: 1; } }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 22px 28px; z-index: 10; pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  .brand-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); animation: heartbeat 1.6s ease-in-out infinite;
  }
  @keyframes heartbeat { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .brand-name { font-weight: 700; font-size: 20px; letter-spacing: 0.5px; }
  .brand-sub {
    font-size: 11px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.8px; margin-top: 2px;
  }

  .telemetry {
    display: flex; align-items: stretch; background: var(--panel);
    border: 1px solid var(--border); border-top: 1px solid var(--chrome-dim);
    backdrop-filter: blur(14px); pointer-events: auto; position: relative;
  }
  .bracket::before, .bracket::after, .bracket-b::before, .bracket-b::after {
    content: ''; position: absolute; width: 10px; height: 10px;
    border-color: var(--chrome); opacity: 0.7;
  }
  .bracket::before { top: -1px; left: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .bracket::after { top: -1px; right: -1px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .bracket-b::before { bottom: -1px; left: -1px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .bracket-b::after { bottom: -1px; right: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  .tel-stat { padding: 10px 20px; text-align: right; }
  .tel-stat + .tel-stat { border-left: 1px solid var(--border); }
  .tel-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; color: var(--chrome); letter-spacing: 0.5px; }
  .tel-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1.2px; margin-top: 3px; font-family: 'IBM Plex Mono', monospace; }

  .feed-panel {
    position: absolute; top: 92px; right: 24px; bottom: 24px; width: 320px;
    background: var(--panel); border: 1px solid var(--border); border-top: 1px solid var(--chrome-dim);
    backdrop-filter: blur(14px); display: flex; flex-direction: column; overflow: hidden; z-index: 10;
  }
  .feed-header {
    padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--chrome); font-family: 'IBM Plex Mono', monospace; letter-spacing: 1.5px;
  }
  .feed-list { flex: 1; overflow-y: auto; padding: 6px; }
  .feed-list::-webkit-scrollbar { width: 5px; }
  .feed-list::-webkit-scrollbar-thumb { background: var(--border); }
  .feed-item {
    display: flex; gap: 10px; padding: 9px 8px; border-bottom: 1px solid rgba(27,42,61,0.5);
    font-size: 14px; animation: slidein 0.3s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: translateX(0); } }
  .feed-item:last-child { border-bottom: none; }
  .feed-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .feed-text { line-height: 1.4; font-weight: 500; }
  .feed-actor { font-weight: 700; }
  .feed-repo {
    color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    display: block; margin-top: 2px; word-break: break-all;
  }
  .feed-empty {
    padding: 20px 12px; color: var(--text-dim); font-size: 13px;
    font-family: 'IBM Plex Mono', monospace; line-height: 1.6;
  }

  .legend {
    position: absolute; left: 28px; bottom: 24px;
    display: flex; flex-direction: column; gap: 7px;
    background: var(--panel); border: 1px solid var(--border); border-top: 1px solid var(--chrome-dim);
    backdrop-filter: blur(14px); padding: 12px 16px; font-size: 13px; z-index: 10;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-weight: 500; }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

  .clock {
    position: absolute; left: 28px; top: 92px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim);
    letter-spacing: 1px; z-index: 10;
  }
  .clock span { color: var(--chrome); }

  @media (max-width: 760px) {
    .clock { display: none; }

    .telemetry { transform: scale(0.85); transform-origin: top right; }

    .feed-panel {
      top: auto; left: 0; right: 0; bottom: 0;
      width: auto; height: 34vh;
      border-radius: 0;
    }

    .legend {
      left: auto; right: 12px; bottom: calc(34vh + 12px);
      padding: 8px 12px; font-size: 11px;
    }
    .legend-row { gap: 6px; }
  }
</style>
</head>
<body>

<div id="boot">
  <div id="boot-text">
    <span>&gt; INITIALIZING DEVPULSE</span>
    <span>&gt; CONNECTING TO GLOBAL EVENT STREAM</span>
    <span>&gt; CALIBRATING GEOSPATIAL GRID</span>
    <span>&gt; ONLINE</span>
  </div>
</div>

<div id="cesiumContainer"></div>

<div class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <div>
      <div class="brand-name">DEVPULSE</div>
      <div class="brand-sub">LIVE GLOBAL DEVELOPER ACTIVITY</div>
    </div>
  </div>
  <div class="telemetry bracket bracket-b">
    <div class="tel-stat">
      <div class="tel-value" id="statEvents">0</div>
      <div class="tel-label">EVENTS</div>
    </div>
    <div class="tel-stat">
      <div class="tel-value" id="statRegions">0</div>
      <div class="tel-label">REGIONS</div>
    </div>
    <div class="tel-stat">
      <div class="tel-value" id="statUpdated">—</div>
      <div class="tel-label">SYNCED</div>
    </div>
  </div>
</div>

<div class="clock">SYS_TIME <span id="utcClock">--:--:--</span> UTC</div>

<div class="feed-panel bracket bracket-b">
  <div class="feed-header">ACTIVITY FEED</div>
  <div class="feed-list" id="feedList">
    <div class="feed-empty" id="feedEmpty">&gt; awaiting geolocated events...</div>
  </div>
</div>

<div class="legend bracket bracket-b">
  <div class="legend-row"><div class="legend-dot" style="background:#3ECF8E"></div> PUSH</div>
  <div class="legend-row"><div class="legend-dot" style="background:#F2A65A"></div> PULL REQUEST</div>
  <div class="legend-row"><div class="legend-dot" style="background:#F2545B"></div> ISSUE</div>
</div>



<script>
Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjUyZXZPZ19iYWhuTE5Tb18iLCJqdGkiOiI3ZjU2NTgyNy05MjA0LTRiMDItYjgzYy0xZDg5NTM2ODYyOTkiLCJpZCI6NDg1MjMzLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODg5NjIzNzl9.B4gyg6RFoEjwPHIYTpnnJZiIcNi9ZvT-SPRTfFTMCNU';
const API_URL = 'https://2y4sezjeo2.execute-api.us-east-1.amazonaws.com/default/devpulseApi';
const POLL_INTERVAL_MS = 8000;

const EVENT_LABELS = {
  PushEvent: 'pushed to',
  PullRequestEvent: 'opened a pull request on',
  IssuesEvent: 'opened an issue on'
};

setTimeout(() => {
  const boot = document.getElementById('boot');
  boot.style.opacity = '0';
  setTimeout(() => boot.remove(), 850);
}, 1900);

function tickClock() {
  document.getElementById('utcClock').textContent = new Date().toISOString().substr(11, 8);
}
tickClock();
setInterval(tickClock, 1000);

const viewer = new Cesium.Viewer('cesiumContainer', {
  animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
  homeButton: false, sceneModePicker: false, navigationHelpButton: false,
  fullscreenButton: false, infoBox: false, selectionIndicator: false,
});
viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#070B12');
viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#05070C');
viewer.scene.globe.enableLighting = false;
viewer.scene.skyAtmosphere.hueShift = -0.86;
viewer.scene.skyAtmosphere.saturationShift = 0.15;
viewer.scene.skyAtmosphere.brightnessShift = -0.1;
viewer.scene.fog.enabled = true;
viewer.cesiumWidget.creditContainer.style.display = 'none';

viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(20, 15, 22000000) });

let autoRotate = true;
viewer.scene.preRender.addEventListener(() => {
  if (autoRotate) viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.00005);
});
['mousedown','wheel','touchstart'].forEach(evt =>
  viewer.canvas.addEventListener(evt, () => { autoRotate = false; })
);

function spawnPulse(lat, lon, hexColor) {
  const color = Cesium.Color.fromCssColorString(hexColor);
  const start = performance.now();
  const beamHeight = 900000; // meters — how far the beam reaches into space
  const growMs = 350;    // beam shoots upward
  const holdMs = 700;    // brief hold at full height
  const fadeMs = 900;    // fades out
  const totalMs = growMs + holdMs + fadeMs;

  function phase() {
    const t = performance.now() - start;
    if (t < growMs) return { h: (t / growMs) * beamHeight, a: 1 };
    if (t < growMs + holdMs) return { h: beamHeight, a: 1 };
    const ft = Math.min((t - growMs - holdMs) / fadeMs, 1);
    return { h: beamHeight, a: 1 - ft };
  }

  // The beam itself — a thin vertical cylinder from the surface upward
  const beam = viewer.entities.add({
    position: new Cesium.CallbackProperty(() => {
      const { h } = phase();
      return Cesium.Cartesian3.fromDegrees(lon, lat, h / 2);
    }, false),
    cylinder: {
      length: new Cesium.CallbackProperty(() => phase().h, false),
      topRadius: 2200,
      bottomRadius: 5500,
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => color.withAlpha(0.55 * phase().a), false)
      ),
      outline: false
    }
  });

  // Bright ground flare at the base — where the beam originates
  const flare = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat),
    point: {
      pixelSize: new Cesium.CallbackProperty(() => {
        const t = performance.now() - start;
        const growT = Math.min(t / growMs, 1);
        return 5 + growT * 6;
      }, false),
      color: color,
      outlineColor: Cesium.Color.WHITE.withAlpha(0.95),
      outlineWidth: 2,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      translucencyByDistance: undefined
    }
  });

  setTimeout(() => {
    viewer.entities.remove(beam);
    viewer.entities.remove(flare);
  }, totalMs + 150);
}

const seen = new Set();
let totalEvents = 0;
const feedList = document.getElementById('feedList');
const statEvents = document.getElementById('statEvents');
const statRegions = document.getElementById('statRegions');
const statUpdated = document.getElementById('statUpdated');
const regionSet = new Set();

function prependFeedItem(evt) {
  const empty = document.getElementById('feedEmpty');
  if (empty) empty.remove();
  const item = document.createElement('div');
  item.className = 'feed-item';
  const dotColor = evt.color === 'green' ? '#3ECF8E' : evt.color === 'orange' ? '#F2A65A' : '#F2545B';
  item.innerHTML = `
    <div class="feed-dot" style="background:${dotColor}"></div>
    <div class="feed-text">
      <span class="feed-actor">${evt.actor || 'someone'}</span> ${EVENT_LABELS[evt.type] || 'acted on'}
      <span class="feed-repo">${evt.repo || ''}</span>
    </div>`;
  feedList.prepend(item);
  while (feedList.children.length > 40) feedList.removeChild(feedList.lastChild);
}

async function poll() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    const events = data.events || [];

    const freshEvents = events.filter(evt => !seen.has(evt.actor + evt.created_at + evt.repo));
    freshEvents.forEach(evt => seen.add(evt.actor + evt.created_at + evt.repo));

    // Stagger reveal — a batch of N new events trickles in over a few
    // seconds instead of firing all at once, so it reads as continuous
    // activity rather than a single burst every poll cycle.
    freshEvents.forEach((evt, i) => {
      const delay = i * (400 + Math.random() * 500);
      setTimeout(() => {
        const colorHex = evt.color === 'green' ? '#3ECF8E' : evt.color === 'orange' ? '#F2A65A' : '#F2545B';
        spawnPulse(evt.lat, evt.lon, colorHex);
        prependFeedItem(evt);
        regionSet.add(Math.round(evt.lat) + ',' + Math.round(evt.lon));
        totalEvents++;
        statEvents.textContent = totalEvents;
        statRegions.textContent = regionSet.size;
      }, delay);
    });

    statUpdated.textContent = 'LIVE';
  } catch (err) {
    console.error('DevPulse fetch failed', err);
    statUpdated.textContent = 'ERR';
  }
}

poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>

</body>
</html>
